<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Premium Dark Background -->
  <rect width="256" height="256" rx="60" fill="#121212" />
  
  <!-- Golden Gradient -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9DF9F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </linearGradient>
  </defs>
  
  <!-- Stylized Eye / Lash Arch -->
  <path d="M 40 140 Q 128 60 216 140" fill="none" stroke="url(#goldGradient)" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Lashes -->
  <path d="M 60 120 L 40 70" fill="none" stroke="url(#goldGradient)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 100 95 L 90 35" fill="none" stroke="url(#goldGradient)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 156 95 L 166 35" fill="none" stroke="url(#goldGradient)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 196 120 L 216 70" fill="none" stroke="url(#goldGradient)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Iris -->
  <circle cx="128" cy="155" r="30" fill="url(#goldGradient)" />
</svg>
